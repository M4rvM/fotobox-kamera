<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Fotobox-Kamera</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
:root{--fir:#163A2E;--night:#0F241D;--brass:#C9A24A;--snow:#F7F8F5;--berry:#8E1F2F}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--night);color:var(--snow);font-family:-apple-system,"Segoe UI",system-ui,sans-serif}
body{display:flex;flex-direction:column;gap:14px;
  padding:calc(env(safe-area-inset-top, 0px) + 18px) 18px calc(env(safe-area-inset-bottom, 0px) + 18px)}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:28px}
#status{font-size:17px;line-height:1.4;padding:12px 14px;border-radius:12px;background:rgba(247,248,245,.08)}
#status.ok{background:var(--fir);border:1px solid var(--brass)}
#status.err{background:var(--berry)}
video{width:100%;flex:1;min-height:0;object-fit:contain;background:#000;border-radius:12px}
.row{display:flex;gap:10px}
button{font:inherit;font-size:18px;font-weight:600;padding:14px 16px;border-radius:12px;border:2px solid var(--brass);
  background:var(--brass);color:var(--night);flex:1;cursor:pointer}
button.ghost{background:transparent;color:var(--snow)}
button:disabled{opacity:.4}
.hint{font-size:14px;opacity:.78;line-height:1.45}
/* Querformat: Bild links, Bedienung rechts, sonst bleibt fürs Bild keine Höhe */
@media (orientation:landscape) and (max-height:600px){
  body{display:grid;grid-template-columns:1fr minmax(200px,36%);grid-template-rows:repeat(6,auto) 1fr;
    align-content:start;gap:8px 14px;
    padding:calc(env(safe-area-inset-top, 0px) + 10px) calc(env(safe-area-inset-right, 0px) + 12px)
            calc(env(safe-area-inset-bottom, 0px) + 10px) calc(env(safe-area-inset-left, 0px) + 12px)}
  body>*{grid-column:2}
  video{grid-column:1;grid-row:1/-1;height:100%}
  h1{font-size:20px}
  #status{font-size:15px;padding:8px 10px}
  .row{flex-direction:column;gap:8px}
  button{font-size:16px;padding:10px 12px}
  #hint{display:none}
}
</style>
</head>
<body>
<h1>Fotobox-Kamera</h1>
<div id="status" role="status">Tippe auf „Kamera starten“.</div>
<video id="preview" autoplay playsinline muted></video>
<div class="row">
  <button id="startBtn">Kamera starten</button>
  <button id="switchBtn" class="ghost" disabled>Kamera wechseln</button>
</div>
<p class="hint" id="cam"></p>
<p class="hint" id="net"></p>
<p class="hint" id="hint"></p>

<script>
(() => {
  const $ = s => document.querySelector(s);
  // ID und Kopplungsschlüssel stehen im #-Teil des QR-Links; der geht an keinen Server.
  const params = new URLSearchParams(location.hash.slice(1));
  const target = params.get('id');
  let key = params.get('k');
  const android = /Android/i.test(navigator.userAgent);
  let stream = null, peer = null, conn = null, call = null;
  let retryTimer = null, openTimer = null, wakeLock = null, started = false, halted = false;

  function setStatus(text, cls) { const s = $('#status'); s.textContent = text; s.className = cls || ''; }

  $('#hint').textContent = android
    ? 'Lass diese Seite in Chrome im Vordergrund geöffnet und schalte den Bildschirm nicht aus. Stell dafür unter Einstellungen › Display › Bildschirm-Zeitlimit die längste Zeit ein.'
    : 'Lass diese Seite im Vordergrund geöffnet und sperre das iPhone nicht. Stell dafür unter Einstellungen › Anzeige & Helligkeit › Automatische Sperre auf „Nie“.';

  const rnd = n => { const a = new Uint8Array(n); crypto.getRandomValues(a); return Array.from(a, b => b.toString(16).padStart(2, '0')).join(''); };
  async function hmac(k, msg) {
    const enc = new TextEncoder();
    const ck = await crypto.subtle.importKey('raw', enc.encode(k), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
    return Array.from(new Uint8Array(await crypto.subtle.sign('HMAC', ck, enc.encode(msg))), b => b.toString(16).padStart(2, '0')).join('');
  }

  if (!target || !key || !/^pruessner-fotobox-[0-9a-f]{18}$/.test(target)) {
    setStatus('Diese Seite weiß nicht, mit welcher Fotobox sie sich verbinden soll. Bitte scanne den QR-Code an der Fotobox.', 'err');
    $('#startBtn').disabled = true;
  } else if (typeof Peer === 'undefined' || !(window.crypto && crypto.subtle)) {
    setStatus('Die Verbindung konnte nicht vorbereitet werden. Prüfe die Internetverbindung und lade die Seite neu.', 'err');
    $('#startBtn').disabled = true;
  }

  // Gewählte Kamera (deviceId) bleibt gespeichert; ohne Wahl nimmt der Browser eine Rückkamera.
  let camId = null;
  try { camId = localStorage.getItem('fotobox-cam'); } catch (e) {}

  async function openCamera() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    const size = { width: { ideal: 1920 }, height: { ideal: 1080 } };
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: false,
        video: camId ? { deviceId: { exact: camId }, ...size } : { facingMode: { ideal: 'environment' }, ...size } });
    } catch (e) {
      if (!camId || e.name === 'NotAllowedError') throw e;
      camId = null; // gespeicherte Kamera gibt es nicht mehr
      return openCamera();
    }
    const track = stream.getVideoTracks()[0];
    camId = track.getSettings().deviceId || camId;
    $('#cam').textContent = 'Kamera: ' + (track.label || 'Standard');
    // „detail“: bei wenig Bandbreite lieber weniger Bilder pro Sekunde als unscharf
    stream.getVideoTracks().forEach(t => { try { t.contentHint = 'detail'; } catch (e) {} });
    const v = $('#preview');
    v.srcObject = stream;
    try { await v.play(); } catch (e) {}
  }

  // Bitrate anheben und anzeigen, wie die Verbindung läuft (direkt im WLAN oder über Umweg).
  let statsTimer = null, connectStart = 0;
  function watchCall(c) {
    clearInterval(statsTimer);
    let tuned = false, lastBytes = 0, lastTime = 0;
    statsTimer = setInterval(async () => {
      const pc = c.peerConnection;
      if (c !== call || !pc) return;
      const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
      if (sender && !tuned) {
        tuned = true;
        try {
          const p = sender.getParameters();
          if (!p.encodings || !p.encodings.length) p.encodings = [{}];
          p.encodings[0].maxBitrate = 8000000;
          p.degradationPreference = 'maintain-resolution';
          await sender.setParameters(p);
        } catch (e) { console.warn('Bitrate nicht gesetzt', e); }
      }
      let route = '', res = '', rate = '';
      const stats = await pc.getStats();
      stats.forEach(r => {
        if (r.type === 'candidate-pair' && r.nominated && r.state === 'succeeded') {
          const local = stats.get(r.localCandidateId), remote = stats.get(r.remoteCandidateId);
          const types = [local && local.candidateType, remote && remote.candidateType];
          route = types.includes('relay') ? 'über Umweg-Server (langsam)' : types.every(t => t === 'host') ? 'direkt im WLAN' : 'über das Internet';
        }
        if (r.type === 'outbound-rtp' && r.kind === 'video') {
          if (r.frameWidth) res = r.frameWidth + '×' + r.frameHeight;
          if (lastTime) rate = ((r.bytesSent - lastBytes) * 8 / ((r.timestamp - lastTime) * 1000)).toFixed(1) + ' Mbit/s';
          lastBytes = r.bytesSent; lastTime = r.timestamp;
        }
      });
      if (route) $('#net').textContent = 'Verbindung ' + route + (res ? ' · ' + res : '') + (rate ? ' · ' + rate : '');
    }, 2000);
  }

  async function start() {
    $('#startBtn').disabled = true;
    setStatus('Kamera wird gestartet …');
    try {
      await openCamera();
    } catch (e) {
      setStatus(e.name === 'NotAllowedError'
        ? (android
          ? 'Der Kamerazugriff wurde abgelehnt. Tippe in Chrome links neben der Adresse auf das Symbol › Berechtigungen › Kamera erlauben und lade die Seite neu.'
          : 'Der Kamerazugriff wurde abgelehnt. Erlaube die Kamera in den Safari-Einstellungen für diese Website und lade die Seite neu.')
        : 'Die Kamera konnte nicht gestartet werden: ' + e.message, 'err');
      $('#startBtn').disabled = false;
      return;
    }
    started = true;
    $('#startBtn').textContent = 'Neu verbinden';
    $('#startBtn').disabled = false;
    $('#switchBtn').disabled = false;
    requestWakeLock();
    connect();
  }

  function connect() {
    clearTimeout(retryTimer); retryTimer = null;
    clearTimeout(openTimer);
    if (peer) { try { peer.destroy(); } catch (e) {} }
    conn = null; call = null; halted = false;
    connectStart = Date.now();
    $('#net').textContent = '';
    setStatus('Verbinde mit der Fotobox …');
    peer = new Peer();
    peer.on('open', () => {
      const c = conn = peer.connect(target, { reliable: true });
      openTimer = setTimeout(() => {
        if (c === conn && !c.authed) {
          setStatus('Keine direkte Verbindung möglich. Sind Handy und Laptop im selben WLAN? Neuer Versuch …', 'err');
          lost();
        }
      }, 15000);
      c.on('open', () => {
        // Kopplung: erst muss die Fotobox den Schlüssel beweisen, dann das Handy.
        c.nonce = rnd(16);
        c.send({ type: 'hello', n: c.nonce });
      });
      c.on('data', msg => onData(c, msg));
      c.on('close', () => { if (c === conn) lost(); });
      c.on('error', () => { if (c === conn) lost(); });
    });
    peer.on('error', e => {
      if (e.type === 'peer-unavailable') setStatus('Die Fotobox ist gerade nicht erreichbar. Ist sie auf dem Laptop geöffnet? Neuer Versuch in 3 Sekunden …', 'err');
      else setStatus('Verbindungsproblem (' + e.type + '). Neuer Versuch in 3 Sekunden …', 'err');
      lost();
    });
  }

  function lost() {
    if (retryTimer || halted) return;
    if ($('#status').className !== 'err') setStatus('Verbindung getrennt. Neuer Versuch in 3 Sekunden …', 'err');
    retryTimer = setTimeout(connect, 3000);
  }

  function rejected() {
    halted = true;
    clearTimeout(openTimer);
    try { peer.destroy(); } catch (e) {}
    setStatus('Die Kopplung wurde abgelehnt. Scanne den QR-Code an der Fotobox neu.', 'err');
  }

  async function onData(c, msg) {
    if (!msg || c !== conn) return;
    if (!c.authed) {
      if (msg.type === 'hello' && !c.proved && typeof msg.n === 'string'
          && msg.p === await hmac(key, 'kiosk:' + c.nonce)) {
        c.proved = true;
        c.send({ type: 'auth', p: await hmac(key, 'phone:' + msg.n) });
      } else if (msg.type === 'ok' && c.proved && typeof msg.k === 'string') {
        c.authed = true;
        clearTimeout(openTimer);
        key = msg.k; // die Fotobox hat den Schlüssel erneuert; für Neuladen der Seite merken
        history.replaceState(null, '', '#' + new URLSearchParams({ id: target, k: key }));
        call = peer.call(target, stream);
        watchCall(call);
        setStatus('Verbunden nach ' + ((Date.now() - connectStart) / 1000).toFixed(1) + ' s. Das Bild ist jetzt auf dem Laptop zu sehen.', 'ok');
      } else {
        rejected();
      }
      return;
    }
    if (msg.type === 'capture') sendPhoto(msg.id);
  }

  async function sendPhoto(id) {
    const v = $('#preview');
    if (!v.videoWidth) return;
    const c = document.createElement('canvas');
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.92));
    if (!blob || !conn || !conn.open) return;
    conn.send({ type: 'photo', id, data: await blob.arrayBuffer() });
  }

  async function switchCamera() {
    // Reihum durch alle Kameras des Handys (vorne, Haupt-, Weitwinkel-, Telekamera …)
    const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput' && d.deviceId);
    if (cams.length < 2) { setStatus('Es wurde nur eine Kamera gefunden.', 'err'); return; }
    const i = cams.findIndex(d => d.deviceId === camId);
    camId = cams[(i + 1) % cams.length].deviceId;
    try { await openCamera(); } catch (e) { setStatus('Diese Kamera konnte nicht gestartet werden. Tippe nochmal auf „Kamera wechseln“.', 'err'); return; }
    try { localStorage.setItem('fotobox-cam', camId); } catch (e) {}
    if (call && call.peerConnection) {
      const sender = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
      if (sender) { try { await sender.replaceTrack(stream.getVideoTracks()[0]); return; } catch (e) {} }
    }
    connect();
  }

  async function requestWakeLock() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }

  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible' || !started) return;
    requestWakeLock();
    const track = stream && stream.getVideoTracks()[0];
    if (!track || track.readyState === 'ended') {
      try { await openCamera(); connect(); } catch (e) { setStatus('Die Kamera wurde beendet. Tippe auf „Neu verbinden“.', 'err'); }
    }
  });

  $('#startBtn').addEventListener('click', () => { if (started) connect(); else start(); });
  $('#switchBtn').addEventListener('click', switchCamera);
})();
</script>
</body>
</html>
