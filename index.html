<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Fotobox-Kamera</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
:root{--fir:#163A2E;--night:#0F241D;--brass:#C9A24A;--snow:#F7F8F5;--berry:#8E1F2F}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--night);color:var(--snow);font-family:-apple-system,"Segoe UI",system-ui,sans-serif}
body{display:flex;flex-direction:column;gap:14px;
  padding:calc(env(safe-area-inset-top, 0px) + 18px) 18px calc(env(safe-area-inset-bottom, 0px) + 18px)}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:28px}
#status{font-size:17px;line-height:1.4;padding:12px 14px;border-radius:12px;background:rgba(247,248,245,.08)}
#status.ok{background:var(--fir);border:1px solid var(--brass)}
#status.err{background:var(--berry)}
video{width:100%;flex:1;min-height:0;object-fit:contain;background:#000;border-radius:12px}
.row{display:flex;gap:10px}
button{font:inherit;font-size:18px;font-weight:600;padding:14px 16px;border-radius:12px;border:2px solid var(--brass);
  background:var(--brass);color:var(--night);flex:1;cursor:pointer}
button.ghost{background:transparent;color:var(--snow)}
button:disabled{opacity:.4}
.hint{font-size:14px;opacity:.78;line-height:1.45}
</style>
</head>
<body>
<h1>Fotobox-Kamera</h1>
<div id="status" role="status">Tippe auf „Kamera starten“.</div>
<video id="preview" autoplay playsinline muted></video>
<div class="row">
  <button id="startBtn">Kamera starten</button>
  <button id="switchBtn" class="ghost" disabled>Kamera wechseln</button>
</div>
<p class="hint">Lass diese Seite im Vordergrund geöffnet und sperre das iPhone nicht. Stell dafür unter Einstellungen › Anzeige &amp; Helligkeit › Automatische Sperre auf „Nie“.</p>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const target = new URLSearchParams(location.search).get('id');
  let stream = null, peer = null, conn = null, call = null;
  let facing = 'environment', retryTimer = null, openTimer = null, wakeLock = null, started = false;

  function setStatus(text, cls) { const s = $('#status'); s.textContent = text; s.className = cls || ''; }

  if (!target) {
    setStatus('Diese Seite weiß nicht, mit welcher Fotobox sie sich verbinden soll. Bitte scanne den QR-Code an der Fotobox.', 'err');
    $('#startBtn').disabled = true;
  } else if (typeof Peer === 'undefined') {
    setStatus('Die Verbindung konnte nicht vorbereitet werden. Prüfe die Internetverbindung und lade die Seite neu.', 'err');
    $('#startBtn').disabled = true;
  }

  async function openCamera() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    const v = $('#preview');
    v.srcObject = stream;
    try { await v.play(); } catch (e) {}
  }

  async function start() {
    $('#startBtn').disabled = true;
    setStatus('Kamera wird gestartet …');
    try {
      await openCamera();
    } catch (e) {
      setStatus(e.name === 'NotAllowedError'
        ? 'Der Kamerazugriff wurde abgelehnt. Erlaube die Kamera in den Safari-Einstellungen für diese Website und lade die Seite neu.'
        : 'Die Kamera konnte nicht gestartet werden: ' + e.message, 'err');
      $('#startBtn').disabled = false;
      return;
    }
    started = true;
    $('#startBtn').textContent = 'Neu verbinden';
    $('#startBtn').disabled = false;
    $('#switchBtn').disabled = false;
    requestWakeLock();
    connect();
  }

  function connect() {
    clearTimeout(retryTimer); retryTimer = null;
    clearTimeout(openTimer);
    if (peer) { try { peer.destroy(); } catch (e) {} }
    conn = null; call = null;
    setStatus('Verbinde mit der Fotobox …');
    peer = new Peer();
    peer.on('open', () => {
      conn = peer.connect(target, { reliable: true });
      openTimer = setTimeout(() => {
        if (conn && !conn.open) {
          setStatus('Keine direkte Verbindung möglich. Sind iPhone und Laptop im selben WLAN? Neuer Versuch …', 'err');
          lost();
        }
      }, 15000);
      conn.on('open', () => {
        clearTimeout(openTimer);
        call = peer.call(target, stream);
        setStatus('Verbunden. Das Bild ist jetzt auf dem Laptop zu sehen.', 'ok');
      });
      conn.on('data', onData);
      conn.on('close', lost);
      conn.on('error', lost);
    });
    peer.on('error', e => {
      if (e.type === 'peer-unavailable') setStatus('Die Fotobox ist gerade nicht erreichbar. Ist sie auf dem Laptop geöffnet? Neuer Versuch in 3 Sekunden …', 'err');
      else setStatus('Verbindungsproblem (' + e.type + '). Neuer Versuch in 3 Sekunden …', 'err');
      lost();
    });
  }

  function lost() {
    if (retryTimer) return;
    if ($('#status').className !== 'err') setStatus('Verbindung getrennt. Neuer Versuch in 3 Sekunden …', 'err');
    retryTimer = setTimeout(connect, 3000);
  }

  function onData(msg) {
    if (msg && msg.type === 'capture') sendPhoto(msg.id);
  }

  async function sendPhoto(id) {
    const v = $('#preview');
    if (!v.videoWidth) return;
    const c = document.createElement('canvas');
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.92));
    if (!blob || !conn || !conn.open) return;
    conn.send({ type: 'photo', id, data: await blob.arrayBuffer() });
  }

  async function switchCamera() {
    facing = facing === 'environment' ? 'user' : 'environment';
    try { await openCamera(); } catch (e) { setStatus('Die andere Kamera konnte nicht gestartet werden.', 'err'); return; }
    if (call && call.peerConnection) {
      const sender = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
      if (sender) { try { await sender.replaceTrack(stream.getVideoTracks()[0]); return; } catch (e) {} }
    }
    connect();
  }

  async function requestWakeLock() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }

  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible' || !started) return;
    requestWakeLock();
    const track = stream && stream.getVideoTracks()[0];
    if (!track || track.readyState === 'ended') {
      try { await openCamera(); connect(); } catch (e) { setStatus('Die Kamera wurde beendet. Tippe auf „Neu verbinden“.', 'err'); }
    }
  });

  $('#startBtn').addEventListener('click', () => { if (started) connect(); else start(); });
  $('#switchBtn').addEventListener('click', switchCamera);
})();
</script>
</body>
</html>
